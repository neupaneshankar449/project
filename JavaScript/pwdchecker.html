<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .container {
            max-width: 300px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        #strengthIndicator {
            font-weight: bold;
            color: red; /* Default to weak/red */
        }
    </style>
</head>
<body>

    <div class="container">
        <label for="passwordInput">Password:</label>
        <input type="password" id="passwordInput" placeholder="Enter password...">
        <p>Strength: <span id="strengthIndicator">Weak</span></p>
    </div>

    
<script src="pwd.js"></script>
</body>
</html>
